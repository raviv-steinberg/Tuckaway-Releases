<script>
  // Every screen of the README: its file name, its caption and the size of its picture.
  var SCREENS = [
    ["history", "History", 1664, 1280],
    ["search", "Search results", 1664, 1280],
    ["filters", "The filters", 1664, 1280],
    ["clip-menu", "The clip menu", 1664, 1280],
    ["edit-versions", "Editing a clip, with its earlier versions", 1664, 1280],
    ["search-by-meaning", "Search by meaning", 1664, 1280],
    ["capture-sessions", "A capture session", 1664, 1280],
    ["favorites", "Favorites", 1664, 1280],
    ["library", "The Library", 1664, 1280],
    ["settings-paste-queue", "Paste queue settings", 1664, 1280],
    ["settings-quick-slots", "Quick Slots settings", 1664, 1280],
    ["run-macro", "Run macro", 1664, 1280],
    ["settings-mini-bar", "Mini Bar settings", 1664, 1280],
    ["secret-guard", "A password hidden by Secret Guard", 1664, 1280],
    ["settings-secret-guard", "Secret Guard settings", 1664, 1280],
    ["app-lock", "The lock screen", 1664, 1280],
    ["settings-app-lock", "App Lock settings", 1664, 1280],
    ["settings-presenter-mode", "Presenter Mode settings", 1664, 1280],
    ["image-toolkit", "The Image Toolkit", 1508, 1118],
    ["sticky-notes", "Sticky notes on the desktop", 1374, 510],
    ["settings-sticky-notes", "Sticky notes settings", 1664, 1280],
    ["screenshot-editor", "The screenshot editor", 1898, 1268],
    ["settings-hot-keys", "Hot Keys settings", 1664, 1280],
    ["settings-insights", "Insights", 1664, 1280],
    ["settings-appearance", "Appearance settings", 1664, 1280],
    ["wizard-welcome", "The setup wizard: Welcome", 1664, 1280],
    ["wizard-look", "The setup wizard: Look", 1664, 1280],
    ["wizard-colour", "The setup wizard: Colour", 1664, 1280],
    ["wizard-shortcuts", "The setup wizard: Shortcuts", 1664, 1280],
    ["wizard-privacy", "The setup wizard: Privacy", 1664, 1280],
    ["wizard-done", "The setup wizard: Done", 1664, 1280],
    ["feature-tour", "Explore Tuckaway", 1628, 1268],
    ["about", "About Tuckaway", 1016, 822],
    ["settings-general", "Settings, General", 1664, 1280],
    ["settings-history", "Settings, History", 1664, 1280],
    ["settings-trash", "Settings, Trash", 1664, 1280]
  ];

  // Builds one before and after slider per screen from the full Dark and Light pictures (images/screens/full). A screen
  // whose full pictures are not published yet shows its combined picture instead (Dark on the left, Light on the right).
  (function () {
    var list = document.getElementById('screens');
    var toc = document.getElementById('toc');

    // Moves a slider's handle to a position from 0 (all Light) to 100 (all Dark) and tells assistive technology.
    function setPosition(slider, handle, value) {
      value = Math.max(0, Math.min(100, value));
      slider.style.setProperty('--pos', value + '%');
      handle.setAttribute('aria-valuenow', Math.round(value));
      handle.setAttribute('aria-valuetext', 'Dark ' + Math.round(value) + ' percent, Light ' + Math.round(100 - value) + ' percent');
      handle.dataset.value = value;
    }

    // Makes the slider follow a pointer (mouse, pen or touch) and the keyboard.
    function wire(slider, handle) {
      function fromPointer(event) {
        var box = slider.getBoundingClientRect();
        setPosition(slider, handle, (event.clientX - box.left) / box.width * 100);
      }
      slider.addEventListener('pointerdown', function (event) {
        if (event.button !== undefined && event.button !== 0) return;
        slider.setPointerCapture(event.pointerId);
        slider.classList.add('dragging');
        handle.focus({ preventScroll: true });
        fromPointer(event);
      });
      slider.addEventListener('pointermove', function (event) {
        if (slider.hasPointerCapture(event.pointerId)) fromPointer(event);
      });
      function release(event) {
        if (slider.hasPointerCapture(event.pointerId)) slider.releasePointerCapture(event.pointerId);
        slider.classList.remove('dragging');
      }
      slider.addEventListener('pointerup', release);
      slider.addEventListener('pointercancel', release);

      // Arrows move 2%, Page Up and Page Down 10%, Home and End to either side.
      handle.addEventListener('keydown', function (event) {
        var value = parseFloat(handle.dataset.value);
        var steps = { ArrowLeft: -2, ArrowDown: -2, ArrowRight: 2, ArrowUp: 2, PageDown: -10, PageUp: 10 };
        if (event.key in steps) value += steps[event.key];
        else if (event.key === 'Home') value = 0;
        else if (event.key === 'End') value = 100;
        else return;
        event.preventDefault();
        setPosition(slider, handle, value);
      });
    }

    // One screen: a slider when both full pictures load, otherwise the combined picture.
    function addScreen(screen) {
      var name = screen[0], caption = screen[1], width = screen[2], height = screen[3];
      var figure = document.createElement('figure');
      figure.className = 'compare';
      figure.id = name;
      var title = document.createElement('figcaption');
      title.textContent = caption;
      figure.appendChild(title);
      list.appendChild(figure);

      var item = document.createElement('li');
      var link = document.createElement('a');
      link.href = '#' + name;
      link.textContent = caption;
      item.appendChild(link);
      toc.appendChild(item);

      function combined() {
        var picture = new Image(width, height);
        picture.className = 'shot';
        picture.loading = 'lazy';
        picture.src = 'images/screens/' + name + '.png';
        picture.alt = caption + ', Dark on the left and Light on the right';
        holder.replaceWith(picture);
      }

      // A box of the picture's proportions holds the place until the pictures arrive, so the page does not jump.
      var holder = document.createElement('div');
      holder.className = 'holder';
      holder.style.aspectRatio = width + ' / ' + height;
      figure.appendChild(holder);

      var dark = new Image(), light = new Image(), loaded = 0, failed = false;
      function ready() {
        if (failed || ++loaded < 2) return;
        var slider = document.createElement('div');
        slider.className = 'slider';
        light.alt = caption + ' in the Light theme';
        dark.alt = caption + ' in the Dark theme';
        dark.className = 'dark';
        slider.appendChild(light);
        slider.appendChild(dark);
        slider.insertAdjacentHTML('beforeend', '<span class="label left">Dark</span><span class="label right">Light</span><span class="bar"></span>');
        var handle = document.createElement('span');
        handle.className = 'handle';
        handle.tabIndex = 0;
        handle.setAttribute('role', 'slider');
        handle.setAttribute('aria-label', caption + ': compare Dark and Light');
        handle.setAttribute('aria-valuemin', '0');
        handle.setAttribute('aria-valuemax', '100');
        handle.innerHTML = '<span aria-hidden="true">&#x2194;</span>';
        slider.appendChild(handle);
        holder.replaceWith(slider);
        setPosition(slider, handle, 50);
        wire(slider, handle);
      }
      function missing() {
        if (failed) return;
        failed = true;
        combined();
      }
      [dark, light].forEach(function (picture) {
        picture.width = width;
        picture.height = height;
        picture.onload = ready;
        picture.onerror = missing;
      });
      // The pictures load only when the screen comes near the view: 36 screens in two themes are many megabytes.
      function load() {
        dark.src = 'images/screens/full/' + name + '-dark.png';
        light.src = 'images/screens/full/' + name + '-light.png';
      }
      if ('IntersectionObserver' in window) {
        var watch = new IntersectionObserver(function (entries) {
          if (entries[0].isIntersecting) {
            watch.disconnect();
            load();
          }
        }, { rootMargin: '800px 0px' });
        watch.observe(holder);
      } else {
        load();
      }
    }

    SCREENS.forEach(addScreen);
  })();
</script>
